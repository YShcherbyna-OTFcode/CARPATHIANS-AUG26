<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Що взяти з собою? — Анкета готовності</title>
<style>
  :root{
    --bg:#2e2e2e;
    --card:#3a3a3a;
    --yellow:#f4d35e;
    --text:#f5f5f5;
    --muted:#bdbdbd;
    --accent:#5fb85f;
    --danger:#e0645b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px 12px 60px;
  }
  .wrap{max-width:720px;margin:0 auto;}
  .title-badge{
    background:var(--yellow);
    color:#2e2e2e;
    text-align:center;
    font-weight:800;
    font-size:1.5rem;
    padding:18px 20px;
    border-radius:16px;
    margin-bottom:28px;
    letter-spacing:0.5px;
  }
  .card{
    background:var(--card);
    border-radius:14px;
    padding:20px 22px;
    margin-bottom:18px;
  }
  .card h3{
    margin:0 0 14px;
    font-size:1.05rem;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--yellow);
    border-bottom:1px solid #555;
    padding-bottom:8px;
  }
  label.field{
    display:block;
    margin-bottom:14px;
    font-size:0.95rem;
  }
  input[type=text], input[type=email]{
    width:100%;
    margin-top:6px;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid #555;
    background:#252525;
    color:var(--text);
    font-size:0.95rem;
  }
  .item-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid #4a4a4a;
  }
  .item-row:last-child{border-bottom:none;}
  .item-name{flex:1;font-size:0.95rem;}
  .toggle{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .toggle button{
    border:1px solid #666;
    background:#2b2b2b;
    color:var(--muted);
    padding:7px 14px;
    border-radius:20px;
    font-size:0.85rem;
    cursor:pointer;
    transition:all .15s;
  }
  .toggle button.yes.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .toggle button.no.active{
    background:var(--danger);
    border-color:var(--danger);
    color:#fff;
  }
  .note-input{
    width:100%;
    margin-top:16px;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid #555;
    background:#252525;
    color:var(--text);
    font-size:0.9rem;
    min-height:60px;
    resize:vertical;
    font-family:inherit;
  }
  .submit-btn{
    width:100%;
    padding:16px;
    font-size:1.05rem;
    font-weight:700;
    border:none;
    border-radius:12px;
    background:var(--yellow);
    color:#2e2e2e;
    cursor:pointer;
    margin-top:8px;
  }
  .submit-btn:disabled{opacity:0.6;cursor:not-allowed;}
  #status{
    text-align:center;
    margin-top:16px;
    font-size:0.95rem;
    min-height:20px;
  }
  #status.ok{color:#8fd98f;}
  #status.err{color:#ff9a90;}
  .required{color:var(--danger);}
  .hint{color:var(--muted);font-size:0.82rem;margin-top:-8px;margin-bottom:14px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="title-badge">Що взяти з собою?<br>Анкета готовності до походу</div>

  <div class="card">
    <h3>Ваші дані</h3>
    <label class="field">Ім'я та прізвище <span class="required">*</span>
      <input type="text" id="fullname" required placeholder="Напр. Олена Коваль">
    </label>
    <label class="field">Email (необов'язково)
      <input type="email" id="email" placeholder="pochta@example.com">
    </label>
    <label class="field">Досвід походів <span class="required">*</span></label>
    <div class="toggle" id="experienceToggle">
      <button type="button" class="yes" data-value="Був(-ла)">Був(-ла)</button>
      <button type="button" class="no" data-value="Не був(-ла)">Не був(-ла)</button>
    </div>
  </div>

  <form id="quizForm">
    <div id="itemsContainer"></div>

    <div class="card">
      <h3>Коментар</h3>
      <textarea class="note-input" id="notes" placeholder="Питання, алергії, чого не вистачає тощо (необов'язково)"></textarea>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Надіслати відповіді</button>
    <div id="status"></div>
  </form>
</div>

<script>
// ---- CONFIGURE THIS: paste your Google Apps Script Web App URL here ----
const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbxr4QuVWmCBPibCExis1ualGTmRyXxK_ZRaNHwxThgi0p4pSxsBbjrYPO80tzbYPFksKA/exec";
// --------------------------------------------------------------------

const SECTIONS = [
  {
    title: "Спорядження",
    items: [
      "Рюкзак (20-30 л)",
      "Трекінгові палиці",
      "Окуляри від сонця",
      "Сідушка (піддупник)",
      "Туристична чашка та ложка",
      "Дощовик"
    ]
  },
  {
    title: "Одяг",
    items: [
      "1 шар - термобілизна",
      "2 шар - флісовий светр",
      "3 шар - мембранна куртка (вітро- та водонепроникна, з каптуром)",
      "Трекінгові штани"
    ]
  },
  {
    title: "Взуття та аксесуари",
    items: [
      "Взуття (трекінгові черевики)",
      "Шкарпетки (трекінгові)",
      "Легенькі рукавички",
      "Головний убір: кепка + шапка або баф",
      "Одяг і легше взуття для перебування у будинку"
    ]
  },
  {
    title: "Також потрібно взяти",
    items: [
      "Документи",
      "Гумові капці для душу",
      "Сонцезахисний крем",
      "Купальний костюм (на випадок відвідування чану)",
      "Особиста аптечка"
    ]
  }
];

const container = document.getElementById("itemsContainer");
const answers = {};
let experience = null;

document.querySelectorAll("#experienceToggle button").forEach(btn => {
  btn.addEventListener("click", () => {
    experience = btn.dataset.value;
    document.querySelectorAll("#experienceToggle button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  });
});

SECTIONS.forEach(section => {
  const card = document.createElement("div");
  card.className = "card";
  const h3 = document.createElement("h3");
  h3.textContent = section.title;
  card.appendChild(h3);

  section.items.forEach(item => {
    answers[item] = null;
    const row = document.createElement("div");
    row.className = "item-row";

    const name = document.createElement("div");
    name.className = "item-name";
    name.textContent = item;

    const toggle = document.createElement("div");
    toggle.className = "toggle";

    const yesBtn = document.createElement("button");
    yesBtn.type = "button";
    yesBtn.className = "yes";
    yesBtn.textContent = "Маю";

    const noBtn = document.createElement("button");
    noBtn.type = "button";
    noBtn.className = "no";
    noBtn.textContent = "Немає";

    yesBtn.addEventListener("click", () => {
      answers[item] = "Маю";
      yesBtn.classList.add("active");
      noBtn.classList.remove("active");
    });
    noBtn.addEventListener("click", () => {
      answers[item] = "Немає";
      noBtn.classList.add("active");
      yesBtn.classList.remove("active");
    });

    toggle.appendChild(yesBtn);
    toggle.appendChild(noBtn);
    row.appendChild(name);
    row.appendChild(toggle);
    card.appendChild(row);
  });

  container.appendChild(card);
});

document.getElementById("quizForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const fullname = document.getElementById("fullname").value.trim();
  const email = document.getElementById("email").value.trim();
  const notes = document.getElementById("notes").value.trim();
  const statusEl = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");

  if(!fullname){
    statusEl.textContent = "Будь ласка, вкажіть ім'я.";
    statusEl.className = "err";
    return;
  }

  if(!experience){
    statusEl.textContent = "Будь ласка, вкажіть, чи маєте досвід походів.";
    statusEl.className = "err";
    return;
  }

  const missing = Object.entries(answers).filter(([k,v]) => v === null);
  if(missing.length > 0){
    statusEl.textContent = "Будь ласка, дайте відповідь по всіх пунктах (" + missing.length + " залишилось).";
    statusEl.className = "err";
    return;
  }

  const payload = {
    timestamp: new Date().toISOString(),
    fullname: fullname,
    email: email,
    experience: experience,
    notes: notes,
    answers: answers
  };

  if(ENDPOINT_URL.startsWith("PASTE_")){
    statusEl.textContent = "Форма не підключена до сховища відповідей (ENDPOINT_URL не налаштовано).";
    statusEl.className = "err";
    console.log("Payload that would be sent:", payload);
    return;
  }

  submitBtn.disabled = true;
  statusEl.textContent = "Надсилання...";
  statusEl.className = "";

  try{
    await fetch(ENDPOINT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(payload)
    });
    statusEl.textContent = "Дякуємо! Ваші відповіді збережено.";
    statusEl.className = "ok";
    document.getElementById("quizForm").reset();
    document.getElementById("fullname").value = "";
    document.querySelectorAll(".toggle button.active").forEach(b => b.classList.remove("active"));
    Object.keys(answers).forEach(k => answers[k] = null);
    experience = null;
  } catch(err){
    statusEl.textContent = "Помилка надсилання. Спробуйте ще раз.";
    statusEl.className = "err";
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
